<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: rgb(255, 221, 1);">
    <div style="color: rgba(0, 123, 255, 0.828);">
    <center>
        <h1>BLOOD DONATION FORM</h1>
        First name <input type="text" name="name"  placeholder="First name"/><br><br>
        last name <input type="text" name="name"  placeholder="last name"/><br><br>
        date of birth<input type="date" name="date of birth" placeholder="MM/DD/YYYY"/><br><br>
        phone<input type="number" name="phone" placeholder="phone"/><br><br>
        email<input type="email" name="email" placeholder="email"/><br><br>
        address<textarea  rows="2" cols="20" placeholder="address"></textarea><br><br>
        blood group<input type="text" name="blood group"  placeholder="blood group"/><br><br>
        Occupation<input type="text" name="Occupation" placeholder="enter your answer here"/><br><br>
        <p>Have you done a blood donation before?</p>
        yes<input type="checkbox" name="yes"/>
        no<input type="checkbox" name="no"/><br><br>
        <input type="button" value="submit" name="submit"/><br><br>
    </center>
    </div>
</body>
</html>
