<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAP</title>
</head>
<body>

    <h2>Rectangle Image Map</h2>

    <img src="image2.jpg" usemap="#map1" width="500" height="300">

    <map name="map1">
        <area shape="rect" coords="50,50,200,250"
            href="https://www.google.com" alt="Rectangle">
    </map>

</body>
</html>
