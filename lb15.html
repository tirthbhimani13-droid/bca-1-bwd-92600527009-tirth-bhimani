<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .hover-image{
            width: 300px;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .hover-image:hover{
            opacity: 0.4;
        }

    </style>
</head>
<body>
    <h2>image opacity on mouseover</h2>
    <img src="image3.jpg" alt="simpl image" class="hover-image">
</body>
</html>
