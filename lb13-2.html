<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Typography Styles</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
    <h1 class="display-4 text-center mb-4">Bootstrap Typography Examples</h1>

    <!-- Inline Text Elements -->
    <p class="text-justify">
        You can use Bootstrap utility classes to apply inline styles like <mark>highlighted text</mark> using <code>&lt;mark&gt;</code>, <del>deleted text</del> using <code>&lt;del&gt;</code>, <ins>inserted text</ins> using <code>&lt;ins&gt;</code>, or <span class="text-uppercase text-danger fw-semibold">uppercase bold alert text</span> using <code>.text-uppercase</code> and <code>.text-danger</code>.
    </p>
</div>

</body>
</html>
