<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 Color Table with Bootstrap & CSS</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        .color-table {
            border: 2px solid #333;
            width: 100%;
            max-width: 450px;
        }

        .color-table td {
            height: 100px;
            width: 33.33%;
            vertical-align: middle;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }


        .color-table td.cell-red:hover { background-color: red; color: white; }
        .color-table td.cell-green:hover { background-color: green; color: white; }
        .color-table td.cell-blue:hover { background-color: blue; color: white; }
        .color-table td.cell-yellow:hover { background-color: yellow; color: black; }
        .color-table td.cell-orange:hover { background-color: orange; color: white; }
        .color-table td.cell-purple:hover { background-color: purple; color: white; }
        .color-table td.cell-pink:hover { background-color: pink; color: black; }
        .color-table td.cell-cyan:hover { background-color: cyan; color: black; }
        .color-table td.cell-gray:hover { background-color: gray; color: white; }
    </style>
</head>
<body class="bg-light">

    <div class="container my-5 text-center">
        <h2 class="mb-4 text-primary">3x3 Color Change Table</h2>
        <p class="text-muted mb-4">Hover over any cell to change its background color.</p>


        <div class="d-flex justify-content-center">
            <table class="table table-bordered color-table shadow-sm">
                <tbody>
                    <tr>
                        <td class="cell-red">Red</td>
                        <td class="cell-green">Green</td>
                        <td class="cell-blue">Blue</td>
                    </tr>
                    <tr>
                        <td class="cell-yellow">Yellow</td>
                        <td class="cell-orange">Orange</td>
                        <td class="cell-purple">Purple</td>
                    </tr>
                    <tr>
                        <td class="cell-pink">Pink</td>
                        <td class="cell-cyan">Cyan</td>
                        <td class="cell-gray">Gray</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
