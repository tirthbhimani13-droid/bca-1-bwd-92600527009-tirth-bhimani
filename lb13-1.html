<!DOCTYPE html>

<head>

        <div class="col-3">City</div>

    <div class="row bg-light py-2 border-bottom border-start border-end">
        <div class="col-2">102</div>
        <div class="col-4">prince rana</div>
        <div class="col-3">BCA</div>
        <div class="col-3">Ahmedabad</div>
    </div>

    <div class="row py-2 border-bottom border-start border-end">
        <div class="col-2">103</div>
        <div class="col-4">smit solanki</div>

</body>
</html>
